const LANES=[

const SONGS=[
 {key:'plug-beat',name:'Plug Beat',genre:'TRAP / PLUG',bpm:140,bars:32,mp3:true,seed:7},

// ---------- audio
let ac=null,master=null,noiseBuf=null,leadGain=null;
function audio(){try{if(!ac){const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();master=ac.createGain();master.gain.value=.85;master.connect(ac.destination);
  leadGain=ac.createGain();leadGain.gain.value=.7;leadGain.connect(master);
  const n=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,n,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0)}if(ac.state=='suspended')ac.resume()}catch(e){}return ac}
const lat=()=>ac?(ac.outputLatency||ac.baseLatency||0):0;
function env(g,t,a,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dec)}
function nz(t,dur,type,freq,q,peak){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||.7;const g=ac.createGain();env(g,t,.002,peak,dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.05)}
function osc(t,f0,f1,dur,peak,type){const o=ac.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur*.8);const g=ac.createGain();env(g,t,.002,peak,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function kick(t){osc(t,150,42,.28,.9);osc(t,900,120,.02,.2,'square')}
function snare(t){nz(t,.16,'bandpass',1900,.8,.5);osc(t,240,140,.08,.28,'triangle')}
function hat(t,open){nz(t,open?.25:.04,'highpass',7500,.7,open?.28:.22)}
function clap(t){nz(t,.1,'bandpass',1400,1.2,.4);nz(t,.08,'bandpass',2200,.8,.25)}
// Guitar lead: sweet on hit, sour on miss
function playLead(lane,ok,sustain){
  if(!ac||!leadGain)return;const t=ac.currentTime+.001;
  const base=[196,246.94,293.66,349.23,440][lane]||220;
  const o=ac.createOscillator();o.type='sawtooth';
  const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=6;
  const g=ac.createGain();
  if(ok){o.frequency.setValueAtTime(base,t);f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(900,t+.2);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.01);
    const dur=sustain?Math.max(.25,sustain):.28;g.gain.exponentialRampToValueAtTime(.12,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.05);
    o.stop(t+dur+.1)}
  else{o.frequency.setValueAtTime(base*1.08,t);o.frequency.linearRampToValueAtTime(base*.82,t+.18);
    f.frequency.value=500;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.stop(t+.3)}
  // slight detune twin for thickness
  const o2=ac.createOscillator();o2.type='square';o2.frequency.value=base*(ok?1.002:.97);o2.detune.value=ok?7:-18;
  const g2=ac.createGain();g2.gain.value=.06;o2.connect(g2);g2.connect(f);
  o.connect(f);f.connect(g);g.connect(leadGain);o.start(t);o2.start(t);o2.stop(t+(ok?(sustain||.3):.25)+.1);
  if(ok&&sustain&&sustain>.4){const wh=ac.createOscillator();wh.type='sine';wh.frequency.value=5;const wg=ac.createGain();wg.gain.value=12;wh.connect(wg);wg.connect(o.frequency);wh.start(t);wh.stop(t+sustain)}
}
function strumClick(){if(!ac)return;nz(ac.currentTime,.03,'highpass',3000,.5,.15)}
// ---------- seeded RNG
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
// ---------- song synthesis + charts
function makeSynthBuffer(meta){
  const sr=ac.sampleRate,beat=60/meta.bpm,dur=meta.bars*4*beat+1.5,N=Math.ceil(sr*dur);
  const buf=ac.createBuffer(2,N,sr),L=buf.getChannelData(0),R=buf.getChannelData(1);
  const r=rng(meta.seed),genre=meta.genre;
  // simple drum+bass+pad bake
  for(let bar=0;bar<meta.bars;bar++){
    for(let step=0;step<16;step++){
      const t=bar*4*beat+step*(beat/4),i0=Math.floor(t*sr);
      const isKick=(genre.includes('TRAP')||genre.includes('DRILL')||genre.includes('EDM'))?(step%4===0||step===6||step===14):(genre.includes('FUNK')?(step===0||step===8||step===10):(step%4===0));
      const isSnare=(genre.includes('TRAP')||genre.includes('DRILL'))?(step===4||step===12||(step===10&&r()>.6)):(step===4||step===12);
      const isHat=step%2===0||(genre.includes('EDM')&&step%1===0);
      if(isKick)bakeKick(L,R,i0,sr);
      if(isSnare)bakeSnare(L,R,i0,sr,r);
      if(isHat)bakeHat(L,R,i0,sr,step%4===2&&genre.includes('FUNK'));
      // bass
      if(step%4===0||(genre.includes('FUNK')&&(step===3||step===7||step===11))){
        const notes={TRAP:[55,55,65.4,73.4],DRILL:[48.99,48.99,55,61.74],'BOOM BAP':[55,73.4,65.4,82.4],ROCK:[82.4,82.4,98,110],
          'R&B':[65.4,73.4,82.4,98],FUNK:[82.4,110,98,123.47],'LO-FI':[55,65.4,73.4,82.4],EDM:[65.4,65.4,82.4,98],'TRAP / PLUG':[55,55,65.4,73.4]};
        const scale=notes[genre]||notes.TRAP;bakeBass(L,R,i0,sr,scale[bar%scale.length]*(step%8===4?1.5:1),beat*.45)}
      // pad chord on bar starts
      if(step===0)bakePad(L,R,i0,sr,[261.63,329.63,392][bar%3],beat*3.5,genre.includes('LO-FI')||genre.includes('R&B')?.08:.05)}
  }
  // soft noise floor
  for(let i=0;i<N;i++){const n=(r()-.5)*.004;L[i]=clamp(L[i]+n,-1,1);R[i]=clamp(R[i]+n*1.1,-1,1)}
  return buf}
function bakeKick(L,R,i0,sr){const len=Math.floor(sr*.28);for(let i=0;i<len&&i0+i<L.length;i++){const t=i/sr,env=Math.exp(-t*14),f=150*Math.exp(-t*18)+40,s=Math.sin(2*Math.PI*f*t)*env*.7;L[i0+i]+=s;R[i0+i]+=s*.95}}
function bakeSnare(L,R,i0,sr,r){const len=Math.floor(sr*.16);for(let i=0;i<len&&i0+i<L.length;i++){const t=i/sr,env=Math.exp(-t*18),n=(r()-.5)*2*env*.45,tone=Math.sin(2*Math.PI*220*t)*env*.2;L[i0+i]+=n+tone;R[i0+i]+=n*.9+tone}}
function bakeHat(L,R,i0,sr,open){const len=Math.floor(sr*(open?.22:.04));for(let i=0;i<len&&i0+i<L.length;i++){const t=i/sr,env=Math.exp(-t*(open?8:40)),n=(Math.random()-.5)*2*env*.18;L[i0+i]+=n;R[i0+i]+=n}}
function bakeBass(L,R,i0,sr,freq,dur){const len=Math.floor(sr*dur);for(let i=0;i<len&&i0+i<L.length;i++){const t=i/sr,env=Math.min(1,t*40)*Math.exp(-t*2.2),s=Math.sin(2*Math.PI*freq*t)*env*.32+Math.sin(2*Math.PI*freq*2*t)*env*.08;L[i0+i]+=s;R[i0+i]+=s*.9}}
function bakePad(L,R,i0,sr,freq,dur,vol){const len=Math.floor(sr*dur);for(let i=0;i<len&&i0+i<L.length;i++){const t=i/sr,env=Math.min(1,t*2)*Math.exp(-t*.4)*(1-t/dur),s=(Math.sin(2*Math.PI*freq*t)+.5*Math.sin(2*Math.PI*freq*1.5*t)+.3*Math.sin(2*Math.PI*freq*2*t))*env*vol;L[i0+i]+=s*.7;R[i0+i]+=s}}
function makeChart(meta,diff){
  const D=DIFFS[diff],beat=60/meta.bpm,r=rng(meta.seed*17+diff.length*91),notes=[],ph=beat*2;
  const dens=D.dens,chordP=D.chord;
  // pattern styles by genre
  const style=meta.genre;
  for(let bar=0;bar<meta.bars;bar++){
    const steps=diff==='easy'?4:diff==='medium'?8:diff==='hard'?12:16;
    const stepDur=(4*beat)/steps;
    for(let s=0;s<steps;s++){
      const t=ph+bar*4*beat+s*stepDur;
      // density gate
      let p=dens;if(s===0)p=1;if(style.includes('LO-FI')||style.includes('R&B'))p*=.75;
      if(style.includes('EDM')&&s%2===0)p*=1.2;if(style.includes('ROCK')&&s%2===0)p*=1.1;
      if(r()>Math.min(.98,p))continue;
      // pick lanes
      let lane=Math.floor(r()*5);
      if(diff==='easy')lane=Math.floor(r()*3); // G R Y only
      if(diff==='medium'&&r()>.85)lane=Math.floor(r()*4);
      // accent on downbeats → green/red
      if(s===0)lane=r()>.5?0:1;
      if((style.includes('TRAP')||style.includes('DRILL'))&&s%4===2)lane=r()>.4?3:4;
      const n={t,lane,hit:0,star:0,sus:0,open:0};
      // sustains
      if(r()<(.12+D.dens*.1)&&(diff!=='easy'||r()<.3)){n.sus=beat*(diff==='expert'?1.5:1)*(r()>.5?1:.5)}
      // chords (two frets)
      if(r()<chordP&&diff!=='easy'){const l2=(lane+1+Math.floor(r()*3))%5;notes.push({t,lane:l2,hit:0,star:0,sus:n.sus,open:0,chord:1})}
      // star phrases every 8 bars near end of phrase
      if(bar%8===7&&s<4)n.star=1;
      notes.push(n)}
  }
  // open strums occasionally on hard+
  if(diff==='hard'||diff==='expert'){for(let i=0;i<Math.floor(meta.bars/4);i++){const t=ph+(4+i*8)*beat+beat*.5;notes.push({t,lane:-1,hit:0,star:0,sus:0,open:1})}}
  notes.sort((a,b)=>a.t-b.t||a.lane-b.lane);
  // prune doubles too close on same lane
  const out=[];const lastT=[-9,-9,-9,-9,-9];
  for(const n of notes){if(n.open){out.push(n);continue}if(n.t-lastT[n.lane]<beat*.2&&!n.chord)continue;lastT[n.lane]=n.t;out.push(n)}
  return out}
// ---------- load songs
const cache={};
async function loadSong(key){
  const meta=SONGS.find(x=>x.key===key)||SONGS[0];S.msg='Loading '+meta.name+'…';menu();audio();
  try{
    if(cache[key]){S.song=cache[key];S.songKey=key;LS.set('gh_song',key);S.msg='';menu();return}
    let buf=null;
    if(meta.mp3){const r=await fetch('./plug-beat.mp3');if(!r.ok)throw new Error('HTTP '+r.status);const ab=await r.arrayBuffer();buf=await decode(ab)}
    else{await new Promise(r=>setTimeout(r,20));buf=makeSynthBuffer(meta)}
    const charts={};for(const d of Object.keys(DIFFS))charts[d]=makeChart(meta,d);
    // for mp3, trim chart duration to audio
    if(meta.mp3){for(const d of Object.keys(charts))charts[d]=charts[d].filter(n=>n.t<buf.duration-0.5)}
    const song={key:meta.key,name:meta.name,genre:meta.genre,bpm:meta.bpm,buf,charts,dur:buf.duration,meta};
    cache[key]=song;S.song=song;S.songKey=key;LS.set('gh_song',key);S.msg='';menu();
  }catch(e){S.msg='Load failed: '+(e.message||e);menu()}
}
function decode(ab){return new Promise((res,rej)=>{try{const p=ac.decodeAudioData(ab,res,e=>rej(e||new Error('decode')));if(p&&p.then)p.then(res,rej)}catch(e){rej(e)}})}
function chart(){return S.song.charts[S.diff]}

const cv=$('cv'),g=cv.getContext('2d');let W=0,H=0,DP=1;
function rs(){DP=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DP;cv.height=H*DP;g.setTransform(DP,0,0,DP,0,0)}addEventListener('resize',rs);rs();
let G=null;const parts=[],pops=[],flash=[0,0,0,0,0];
const frets=[0,0,0,0,0]; // held state
let strumFlash=0;
function newGame(){const notes=chart().map(n=>({...n,hit:0,res:null,held:0}));return{notes,src:null,t0:0,paused:false,pauseAt:0,score:0,combo:0,maxc:0,mult:1,
  cnt:{perfect:0,great:0,good:0,miss:0},star:0,starOn:0,ni:0,done:false,rock:.5,failed:false,
  end:Math.max(S.song.dur,(notes.length?notes[notes.length-1].t:0)+1.8),last:0,whammy:0}}
function songT(){if(!G||!ac)return 0;if(G.paused)return G.pauseAt;return ac.currentTime-G.t0-lat()}
function startSong(seek){audio();G=newGame();const lead=1.8,s0=seek||0;const src=ac.createBufferSource();src.buffer=S.song.buf;const gn=ac.createGain();gn.gain.value=.75;src.connect(gn);gn.connect(master);
 G.t0=ac.currentTime+lead-s0;src.start(ac.currentTime+lead,s0);G.src=src;for(const n of G.notes)if(n.t<s0-.2)n.hit=-1;S.mode='play';$('menu').style.display='none';$('hudbtn').style.display='flex';$('star').style.display='block'}

  // Use exact: all held frets must match the set of notes at this time within a tiny window — for single note, that fret must be held (others ignored for Easy/Med).
  if(S.diff==='easy'||S.diff==='medium')return !!frets[n.lane];

  const t=songT();const needed=new Set();

 else{const hi=LS.json(hiKey(),null),hist=LS.json('gh_hist',[]).slice(0,8),ready=!!S.song;
  const songBtns=SONGS.map(s=>`<button class="songb ${S.songKey===s.key?'on':''}" data-song="${s.key}"><b>${esc(s.name)}</b><small>${s.genre} · ${s.bpm} BPM${s.mp3?' · MP3':''}</small></button>`).join('');

  h=`<div class="box"><h1>PLUG GUITAR HERO</h1><div class="sub">// BOT CITY NEON FRET DIVISION</div>${S.msg?`<div class="res">${esc(S.msg)}</div>`:''}

  <h2>DIFFICULTY</h2><div class="row">${Object.keys(DIFFS).map(k=>`<button data-d="${k}" class="${S.diff===k?'on':''}">${DIFFS[k].n}</button>`).join('')}</div>
  <div class="note">High score: ${hi?`<b class="y">${hi.s}</b> (${hi.a}%, ${hi.stars||0}★)`:'none yet'}</div>
  <div class="row"><label style="flex:1;font-size:10px;color:#889">PLAYER<input type="text" id="n1" maxlength="14" value="${esc(S.name)}" style="width:100%;background:#03040a;border:1px solid #333a55;color:#fff;font:700 15px monospace;padding:8px"></label></div>
  <div class="row"><button class="go" id="play" ${ready?'':'disabled'}>▶ PLAY</button></div>
  <h2>HISTORY</h2><table style="width:100%;border-collapse:collapse;font-size:10.5px"><tr><th style="text-align:left;color:#889">DATE</th><th style="text-align:left;color:#889">SONG</th><th style="text-align:left;color:#889">SCORE</th><th style="text-align:left;color:#889">★</th></tr>${rows}</table>
  <h2>CONTROLS</h2><div class="note"><b class="y">Touch:</b> hold fret pads + tap STRUM bar.<br>
  <b class="y">Keys:</b> 1-5 or A S D F G = frets · Space = strum · Enter/Shift = star power.<br>
  <b class="y">Xbox:</b> A B Y X LB = frets · D-pad ↑↓ = strum · RT = star power.<br>

 M.innerHTML=h;const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};

 for(const i of M.querySelectorAll('input[type=text]'))i.onkeydown=e=>e.stopPropagation()}

 (async()=>{await loadSong(S.songKey);if(S.song){startSong(+(Q.get('seek')||0));
