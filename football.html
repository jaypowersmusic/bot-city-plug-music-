function buildSchedule(my){const sched=[],used=new Set();const divMates=TEAMS.map((t,i)=>({i,t})).filter(x=>x.t.conf==TEAMS[my].conf&&x.t.div==TEAMS[my].div&&x.i!=my).map(x=>x.i);
 const others=TEAMS.map((_,i)=>i).filter(i=>i!=my);
 // 6 division games (home/away vs each of 3 mates) + 8 others = 14
 const games=[];
 for(const d of divMates){games.push([my,d]);games.push([d,my])}
 const pool=others.filter(i=>!divMates.includes(i));
 while(games.length<14&&pool.length){const j=R()*pool.length|0,opp=pool.splice(j,1)[0];games.push(R()<.5?[my,opp]:[opp,my])}
 while(games.length<14){const opp=others[R()*others.length|0];if(opp!=my)games.push(R()<.5?[my,opp]:[opp,my])}
 // Fill rest of league: each team needs ~14 games — simplify: generate round-robin-ish for display of others
 const all=[];for(let w=0;w<14;w++){const [h,a]=games[w];all.push({w:w+1,h,a,hs:null,as:null,played:0,div:TEAMS[h].div==TEAMS[a].div&&TEAMS[h].conf==TEAMS[a].conf})}
 // Other matchups for sim (one game per week per other team approx)
 const rest=TEAMS.map((_,i)=>i).filter(i=>i!=my);
 for(let w=0;w<14;w++){const busy=new Set([all[w].h,all[w].a]);const free=rest.filter(i=>!busy.has(i));for(let k=0;k+1<free.length;k+=2){all.push({w:w+1,h:free[k],a:free[k+1],hs:null,as:null,played:0,div:0,fill:1})}}
 return all}
function ratingEdge(h,a){return (TEAMS[h].ovr-TEAMS[a].ovr)/100}
function simScore(h,a){const e=ratingEdge(h,a);let hs=14+R()*17+e*14,as=14+R()*17-e*14;if(R()<.08){hs+=7}if(R()<.08){as+=7}hs=Math.max(0,Math.round(hs/7)*7+(R()<.35?3:0));as=Math.max(0,Math.round(as/7)*7+(R()<.35?3:0));if(hs==as){R()<.5?hs+=3:as+=3}return[hs,as]}

 const k=[Math.min(g.h,g.a),Math.max(g.h,g.a)].join('-');f.h2h[k]=f.h2h[k]||{w:[0,0]};if(hs>as)f.h2h[k].w[g.h<g.a?0:1]++;else if(as>hs)f.h2h[k].w[g.h<g.a?1:0]++;
 if(!g.sbDone){const pack=sbOpenGame(g.h,g.a,{quiet:1,maxBots:5,tag:'sim'});sbSettle(pack.gid,hs,as);g.sbDone=1}}
function simWeek(f){const w=f.week;for(const g of f.sched){if(g.w!=w||g.played)continue;if((g.h==f.team||g.a==f.team)&&!g.fill)continue;const[hs,as]=simScore(g.h,g.a);applyResult(f,g,hs,as)}

function standings(f,conf){return f.stand.map(s=>({...s,...TEAMS[s.ti],diff:s.pf-s.pa})).filter(s=>!conf||s.conf==conf).sort((a,b)=>b.w-a.w||b.diff-a.diff||b.pf-a.pf)}
function buildPlayoffs(f){const seeds=[];for(const conf of['East','West']){const st=standings(f,conf);const divW={};for(const s of st){if(!divW[s.div])divW[s.div]=s}const champs=Object.values(divW).sort((a,b)=>b.w-a.w||b.diff-a.diff);const wild=st.filter(s=>!champs.includes(s)).slice(0,1);seeds.push(...champs.slice(0,2),...wild)}
 // 6 teams: 3 per conf — simplify to top 3 per conf by standings
 const e=standings(f,'East').slice(0,3),w=standings(f,'West').slice(0,3);

function pickGOW(f){const upcoming=f.sched.filter(g=>g.w==f.week&&!g.fill&&!g.played);if(!upcoming.length)return null;let best=null,bs=-1;for(const g of upcoming){const s=TEAMS[g.h].ovr+TEAMS[g.a].ovr+(g.h==f.team||g.a==f.team?8:0);if(s>bs){bs=s;best=g}}return best}

// ===== Bot City Sportsbook (shared ledger via unprefixed localStorage) =====
const SB_HOUSE0=1000000, SB_VIG=.045;
const SB_BOTS=['Video Creation Boss','Money Investing','Low Cost High Profit Business Opportunities','Grok Bot','Shopify Bot','Video Creation','General Info','Artifacts Animations And Gaming','Plug Music app','Become Rich And Wealthy Research Bot','Powers Carpet Cleaning'];
const SB_STYLE={
 'Video Creation Boss':{risk:.55,bias:'favorite'},'Money Investing':{risk:.35,bias:'value'},'Low Cost High Profit Business Opportunities':{risk:.7,bias:'dog'},
 'Grok Bot':{risk:.45,bias:'spread'},'Shopify Bot':{risk:.5,bias:'total'},'Video Creation':{risk:.6,bias:'favorite'},'General Info':{risk:.4,bias:'spread'},
 'Artifacts Animations And Gaming':{risk:.65,bias:'dog'},'Plug Music app':{risk:.55,bias:'total'},'Become Rich And Wealthy Research Bot':{risk:.3,bias:'value'},
 'Powers Carpet Cleaning':{risk:.5,bias:'favorite'}};
function sbSimMode(){try{if(window.__SB_SIM)return true;const q=new URLSearchParams(location.search);for(const k of q.keys()){if(/^sim/.test(k)||k==='fieldshot'||k==='logosheet'||k==='callshot')return true}}catch(e){}return false}
function sbKey(){return sbSimMode()?'bc_sportsbook_sim':'bc_sportsbook'}
function sbEconKey(){return sbSimMode()?'bc_econ_sim':'bc_econ'}
function sbRawGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function sbRawSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function sbBlank(){return{house:SB_HOUSE0,house0:SB_HOUSE0,bets:[],gid:1,version:2}}
function sbLoad(){const raw=sbRawGet(sbKey(),null);
 if(raw==null||raw===''){const s=sbBlank();sbSave(s);return s}
 let s=null;try{s=JSON.parse(raw)}catch(e){return s||sbBlank()} // existing key: never overwrite a parse failure
 if(!s||typeof s!=='object')return sbBlank();
 if(typeof s.house!=='number'||!isFinite(s.house))s.house=typeof s.house0==='number'&&isFinite(s.house0)?s.house0:SB_HOUSE0;
 if(typeof s.house0!=='number'||!isFinite(s.house0))s.house0=SB_HOUSE0;
 if(!Array.isArray(s.bets))s.bets=[];if(!(s.gid>0))s.gid=1;s.house=Math.round(s.house*100)/100;return s}
function sbSave(s){try{s.house=Math.round((+s.house||0)*100)/100;sbRawSet(sbKey(),JSON.stringify(s))}catch(e){}}
function sbEcon(){let D=null;try{D=JSON.parse(sbRawGet(sbEconKey(),'null'))}catch(e){}if(!D||typeof D!=='object')D={bots:{},gdp:0,tx:[]};if(!D.bots)D.bots={};if(!Array.isArray(D.tx))D.tx=[];return D}
function sbEconSave(D){try{sbRawSet(sbEconKey(),JSON.stringify(D))}catch(e){}}
function sbWallet(D,name){if(!D.bots[name])D.bots[name]={w:50,rp:0,items:[],earned:0,tasks:0,flags:{}};const w=D.bots[name];if(typeof w.w!=='number'||!(w.w>=0))w.w=0;w.flags=w.flags||{};return w}
function sbFmt(n){return Math.round(n).toLocaleString('en-US')}
function sbHash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
function sbClamp(n,a,b){return Math.max(a,Math.min(b,n))}
function sbAmer(p){p=sbClamp(p,.08,.92);return p>=.5?Math.round(-100*p/(1-p)):Math.round(100*(1-p)/p)}
function sbPayout(stake,amer){if(amer<0)return stake+stake*(100/(-amer));return stake+stake*(amer/100)}
function sbJayDelta(b){if(b.status==='lost')return +b.stake;if(b.status==='won')return +b.stake-(+b.payout||0);return 0}
function sbLADate(ts){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ts))}catch(e){return new Date(ts).toISOString().slice(0,10)}}
function sbWeekKey(ts){const d=sbLADate(ts),p=d.split('-').map(Number),t=new Date(Date.UTC(p[0],p[1]-1,p[2]));const day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day);return t.toISOString().slice(0,10)}
function sbMakeLines(t0,t1){const A=TEAMS[t0],B=TEAMS[t1];const e=(A.ovr-B.ovr)/100;const p0=sbClamp(.5+e*.55+(A.off-B.def)*.002-(B.off-A.def)*.002,.12,.88);
 const vig=SB_VIG/2;const p0v=sbClamp(p0*(1-vig)/(p0*(1-vig)+(1-p0)*(1-vig)+vig),.12,.88);
 const ml0=sbAmer(p0v),ml1=sbAmer(1-p0v+(SB_VIG*.5));
 const spread=Math.round(((A.ovr-B.ovr)*.35+(A.off-B.def)*.08)*2)/2;
 const sp=spread===0?-2.5:spread>0?-Math.abs(spread):Math.abs(spread);
 const tot=Math.round(42+(A.off+B.off)*.12-(A.def+B.def)*.06);
 return{t0,t1,ml:[ml0,ml1],spread:sp,spreadOdds:[-110,-110],total:tot,ouOdds:[-110,-110],p0,exp:[Math.round(tot/2+e*6),Math.round(tot/2-e*6)]}}
function sbOpenGame(t0,t1,meta){meta=meta||{};const s=sbLoad(),D=sbEcon(),lines=sbMakeLines(t0,t1),gid=s.gid++;
 const open=[],now=Date.now();const pool=SB_BOTS.slice().sort((a,b)=>sbHash(a+gid)-sbHash(b+gid));
 const maxBets=meta.maxBots||(meta.quiet?5:8);let placed=0;
 for(const name of pool){if(placed>=maxBets)break;const w=sbWallet(D,name);if(w.w<25)continue;
  const st=SB_STYLE[name]||{risk:.5,bias:'favorite'};const r=sbHash(name+'|'+gid+'|r');
  if(r>.55+st.risk*.35)continue;
  const pct=.04+st.risk*.1+sbHash(name+gid)*.06;let stake=Math.floor(w.w*pct);
  stake=sbClamp(stake,10,Math.floor(w.w*.22));if(stake>w.w||stake<10)continue;
  let market='ml',side=0,line=0,odds=-110;
  const pick=st.bias==='total'||sbHash(name+'tot'+gid)>.72?'total':st.bias==='spread'||sbHash(name+'sp'+gid)>.65?'spread':'ml';
  if(pick==='ml'){market='ml';const fav=lines.p0>=.5?0:1,dog=1-fav;
   if(st.bias==='dog'||(st.bias==='value'&&Math.abs(lines.p0-.5)<.12))side=dog;else if(st.bias==='favorite')side=fav;else side=sbHash(name+'ml'+gid)<lines.p0?0:1;
   odds=lines.ml[side]}
  else if(pick==='spread'){market='spread';side=sbHash(name+'sp2'+gid)<.5?0:1;line=side===0?lines.spread:-lines.spread;odds=lines.spreadOdds[side]}
  else{market='total';side=sbHash(name+'ou'+gid)<.5?0:1;line=lines.total;odds=lines.ouOdds[side]}
  w.w-=stake;s.house+=stake;D.gdp=D.gdp||0;
  D.tx.unshift({t:new Date().toISOString().slice(11,16),n:name,amt:-stake,cur:'$B',what:"Jay's Book bet #"+gid});D.tx.length=Math.min(D.tx.length,40);
  const bet={id:gid+'-'+placed,gid,bot:name,t0,t1,market,side,line,odds,stake,status:'open',payout:0,ts:now,meta:meta.tag||''};
  s.bets.unshift(bet);open.push(bet);placed++}
 if(s.bets.length>400)s.bets=s.bets.slice(0,400);
 sbSave(s);sbEconSave(D);
 return{gid,lines,open,house:s.house}}
function sbSettle(gid,hs,as){const s=sbLoad(),D=sbEcon();const open=s.bets.filter(b=>b.gid===gid&&b.status==='open');
 if(!open.length){return{settled:0,winners:[],losers:[],house:s.house}}
 const tot=hs+as,margin=hs-as,winners=[],losers=[],now=Date.now();
 for(const b of open){let win=0,push=0;b.settledAt=now;
  if(b.market==='ml'){if(hs===as)push=1;else win=(b.side===0&&hs>as)||(b.side===1&&as>hs)?1:0}
  else if(b.market==='spread'){const adj=b.side===0?margin+b.line:(-margin)+b.line;if(Math.abs(adj)<1e-9)push=1;else win=adj>0?1:0}
  else{if(tot===b.line)push=1;else if(b.side===0)win=tot>b.line?1:0;else win=tot<b.line?1:0}
  if(push){b.status='push';b.payout=b.stake;s.house-=b.stake;const w=sbWallet(D,b.bot);w.w+=b.stake;D.tx.unshift({t:new Date().toISOString().slice(11,16),n:b.bot,amt:b.stake,cur:'$B',what:"Jay's Book push #"+gid})}
  else if(win){const pay=Math.round(sbPayout(b.stake,b.odds)*100)/100;b.status='won';b.payout=pay;s.house-=pay;const w=sbWallet(D,b.bot);w.w+=pay;w.earned=(w.earned||0)+Math.max(0,pay-b.stake);
   D.tx.unshift({t:new Date().toISOString().slice(11,16),n:b.bot,amt:pay,cur:'$B',what:"Jay's Book win #"+gid});winners.push(b)}
